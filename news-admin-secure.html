<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS ADMIN | HELPING HANDS FOR ECHS</title>
<style>
:root{--navy:#0b1f3a;--gold:#c6a45a;--ivory:#f7f6f2;--ink:#1d2b3a;--muted:#667586}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:16px Arial,sans-serif}.wrap{max-width:760px;margin:7vh auto;padding:22px}.panel{background:#fff;border:1px solid #e1e5ea;border-radius:14px;padding:28px;box-shadow:0 8px 28px #132b4310}h1{font-size:24px;color:var(--navy);margin:0 0 6px}h2{font-size:19px;color:var(--navy);margin:0 0 22px}label{display:block;font-size:13px;font-weight:800;letter-spacing:.04em;margin:17px 0 7px}input,textarea{width:100%;border:1px solid #cbd3dc;border-radius:8px;padding:12px;font:16px Arial;color:var(--ink)}textarea{min-height:180px;resize:vertical;line-height:1.5}button{border:0;border-radius:8px;padding:13px 19px;background:var(--navy);color:white;font-weight:800;letter-spacing:.04em;cursor:pointer}button.gold{background:var(--gold);color:var(--navy)}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.muted{color:var(--muted);font-size:13px}.status{margin-top:16px;padding:12px;border-radius:8px;background:#eef3f6;display:none;line-height:1.5}.status.show{display:block}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.hidden{display:none!important}
</style></head><body><main class="wrap"><section class="panel">
<div class="top"><div><h1>HELPING HANDS FOR ECHS</h1><div class="muted">NEWS ADMINISTRATION</div></div><button id="logout" class="hidden">LOG OUT</button></div>
<div id="login"><h2>ADMIN LOGIN</h2><p>Only the authorised administrator can publish website news.</p><button id="signin" class="gold">SIGN IN WITH GITHUB</button></div>
<div id="editor" class="hidden"><h2>ADD NEWS</h2><p class="muted">ENTER THE DATE, HEADLINE AND NEWS CONTENT</p>
<label for="date">DATE</label><input id="date" type="date">
<label for="headline">HEADLINE</label><input id="headline" maxlength="180" placeholder="Enter news headline">
<label for="body">NEWS CONTENT</label><textarea id="body" maxlength="5000" placeholder="Enter short news message"></textarea>
<div class="actions"><button id="publish" class="gold">PUBLISH</button><button id="clear" type="button">CLEAR</button></div>
<div id="status" class="status" role="status"></div></div>
</section><p class="muted" style="text-align:center">HELPING HANDS FOR ECHS</p></main>
<script>
const $=id=>document.getElementById(id);const status=(msg,ok=false)=>{$('status').textContent=msg;$('status').className='status show';$('status').style.background=ok?'#edf7ef':'#fff3e8';};
async function check(){try{const r=await fetch('/api/auth/me',{cache:'no-store'});const j=await r.json();$('login').classList.toggle('hidden',j.authenticated);$('editor').classList.toggle('hidden',!j.authenticated);$('logout').classList.toggle('hidden',!j.authenticated);}catch{$('login').classList.remove('hidden');status('Unable to contact the publishing service.');}}
$('signin').onclick=()=>location.href='/api/auth/login';
$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.reload();};
$('clear').onclick=()=>{$('date').value='';$('headline').value='';$('body').value='';$('status').className='status';};
$('publish').onclick=async()=>{const date=$('date').value,headline=$('headline').value.trim(),body=$('body').value.trim();if(!date||!headline||!body){status('Please complete all three fields.');return;}if(!confirm('PUBLISH THIS NEWS FOR ALL WEBSITE VISITORS?'))return;$('publish').disabled=true;$('publish').textContent='PUBLISHING…';try{const r=await fetch('/api/news',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,headline,body})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Publishing failed.');status('PUBLISHED SUCCESSFULLY. The website news file has been updated. Website refresh may take a short time. '+(j.commit?'Commit: '+j.commit:''),true);$('date').value='';$('headline').value='';$('body').value='';}catch(e){status(e.message+' No success was reported.');}finally{$('publish').disabled=false;$('publish').textContent='PUBLISH';}};
check();
</script></body></html>
